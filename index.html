}

}

    background: #23282e;
}


.load {

    background: #1d252b;
}

   СТАТИСТИКА
===================================================== */

.stats {

    height: 39px;

    min-height: 39px;

    display: flex;

    align-items: center;

    gap: 25px;

}

}

   ЦИКЛЫ

.cycles {

#charts {

/* =====================================================

@media (max-width: 700px) {

<body>

<!-- =====================================================
     ВЕРХНЯЯ ПАНЕЛЬ
===================================================== -->

<div class="header">

<div class="logo">
    FLOW
</div>


<input
    id="symbol"
    class="input symbol"
    value="BTCUSDT"
    placeholder="Инструмент"
>


<input
    id="date"
    class="input date"
    type="date"
>


<input
    id="startTime"
    class="input time"
    type="time"
    value="09:00"
>


<button
    class="load"
    onclick="loadDemo()"
>
    ЗАГРУЗИТЬ
</button>

</div>

<!-- =====================================================
     СТАТИСТИКА
===================================================== -->

<div class="stats">

<div class="stat">

    <span class="stat-name">
        ASK
    </span>

    <span
        class="ask"
        id="askStats"
    >
        0 trades | $0
    </span>

</div>


<div class="stat">

    <span class="stat-name">
        BID
    </span>

    <span
        class="bid"
        id="bidStats"
    >
        0 trades | $0
    </span>

</div>


<div class="stat">

    <span class="stat-name">
        DELTA
    </span>

    <span
        class="delta"
        id="deltaStats"
    >
        0.00%
    </span>

</div>

</div>

<!-- =====================================================
     ЦИКЛЫ
===================================================== -->

<div class="cycles">

<button
    class="cycle"
    onclick="setRange(1, this)"
>
    1H
</button>


<button
    class="cycle"
    onclick="setRange(2, this)"
>
    2H
</button>


<button
    class="cycle"
    onclick="setRange(4, this)"
>
    4H
</button>


<button
    class="cycle active"
    onclick="setRange(6, this)"
>
    6H
</button>


<button
    class="cycle"
    onclick="setRange(12, this)"
>
    12H
</button>


<button
    class="cycle"
    onclick="showAll(this)"
>
    ВСЁ
</button>


<button
    class="cycle"
    onclick="resetCharts()"
>
    RESET
</button>

</div>

<!-- =====================================================
     ГРАФИКИ
===================================================== -->

<div id="charts">

<div id="flowChart"></div>

<div id="deltaChart"></div>

</div>

<script>


/* =====================================================
   ДЕМО-ДАННЫЕ
===================================================== */

let data = [];


const now =
    new Date();


const start =
    new Date(
        now.getTime() -
        12 * 60 * 60 * 1000
    );


let ask = 0;

let bid = 0;

let askUsd = 0;

let bidUsd = 0;


for (
    let i = 0;
    i <= 720;
    i++
) {

    const time =
        new Date(
            start.getTime() +
            i * 60 * 1000
        );


    /*
       Делаем потоки немного
       неодинаковыми, чтобы линии
       не лежали друг на друге.
    */

    const wave =
        Math.sin(i / 30) * 35;


    const wave2 =
        Math.sin(i / 13) * 15;


    ask +=
        300 +
        wave +
        wave2 +
        Math.random() * 100;


    bid +=
        300 -
        wave +
        Math.random() * 100;


    askUsd +=
        2200000 +
        Math.random() * 700000;


    bidUsd +=
        2200000 +
        Math.random() * 700000;


    data.push({

        time,

        ask,

        bid,

        askUsd,

        bidUsd

    });

}


/* =====================================================
   DELTA
===================================================== */

function getDelta(
    ask,
    bid
) {

    if (
        bid === 0
    ) {

        return 0;
    }


    return (
        (ask - bid) /
        bid
    ) * 100;
}


/* =====================================================
   ДЕНЬГИ
===================================================== */

function money(
    value
) {

    if (
        value >= 1e9
    ) {

        return "$" +
            (
                value / 1e9
            ).toFixed(2) +
            "B";
    }


    if (
        value >= 1e6
    ) {

        return "$" +
            (
                value / 1e6
            ).toFixed(2) +
            "M";
    }


    if (
        value >= 1e3
    ) {

        return "$" +
            (
                value / 1e3
            ).toFixed(1) +
            "K";
    }


    return "$" +
        value.toFixed(0);
}


/* =====================================================
   СТАТИСТИКА
===================================================== */

function updateStats() {

    const last =
        data[
            data.length - 1
        ];


    if (!last) {

        return;
    }


    const delta =
        getDelta(
            last.ask,
            last.bid
        );


    document
        .getElementById(
            "askStats"
        )
        .textContent =
        Math.round(
            last.ask
        ).toLocaleString() +
        " trades | " +
        money(
            last.askUsd
        );


    document
        .getElementById(
            "bidStats"
        )
        .textContent =
        Math.round(
            last.bid
        ).toLocaleString() +
        " trades | " +
        money(
            last.bidUsd
        );


    document
        .getElementById(
            "deltaStats"
        )
        .textContent =
        (
            delta >= 0
                ? "+"
                : ""
        ) +
        delta.toFixed(2) +
        "%";
}


/* =====================================================
   ЦВЕТА ТЕРМИНАЛА
===================================================== */

const GRID =
    "#1c2126";

const AXIS =
    "#30363c";

const TEXT =
    "#777f87";

const CROSS =
    "#737b83";


/* =====================================================
   БАЗОВЫЙ LAYOUT
===================================================== */

function baseLayout() {

    return {

        paper_bgcolor:
            "#090b0d",

        plot_bgcolor:
            "#090b0d",

        margin: {

            l: 50,

            r: 65,

            t: 5,

            b: 28
        },


        font: {

            family:
                "Arial",

            color:
                TEXT,

            size:
                11
        },


        hovermode:
            "closest",


        dragmode:
            "pan",


        showlegend:
            true,


        legend: {

            x:
                1.01,

            xanchor:
                "left",

            y:
                1,

            yanchor:
                "top",

            bgcolor:
                "rgba(0,0,0,0)",

            borderwidth:
                0,

            font: {

                size:
                    11,

                color:
                    "#c5c9cd"
            }
        },


        xaxis: {

            type:
                "date",


            showgrid:
                true,

            gridcolor:
                GRID,


            linecolor:
                AXIS,


            tickfont: {

                color:
                    TEXT
            },


            /*
               НИКАКОГО мини-графика
               / rangeslider здесь нет.
            */

            rangeslider: {

                visible:
                    false
            },


            showspikes:
                true,

            spikemode:
                "across+marker",

            spikesnap:
                "cursor",

            spikecolor:
                CROSS,

            spikethickness:
                1,

            spikedash:
                "dot",


            fixedrange:
                false
        },


        yaxis: {

            side:
                "right",


            showgrid:
                true,

            gridcolor:
                GRID,


            zeroline:
                false,


            linecolor:
                AXIS,


            tickfont: {

                color:
                    TEXT
            },


            /*
               ГОРИЗОНТАЛЬНЫЙ
               CROSSHAIR
            */

            showspikes:
                true,

            spikemode:
                "across+marker",

            spikesnap:
                "cursor",

            spikecolor:
                CROSS,

            spikethickness:
                1,

            spikedash:
                "dot",


            fixedrange:
                false
        }

    };
}


/* =====================================================
   FLOW GRAPH
===================================================== */

function drawFlow() {

    const times =
        data.map(
            x => x.time
        );


    const askValues =
        data.map(
            x => x.ask
        );


    const bidValues =
        data.map(
            x => x.bid
        );


    const traces = [

        {

            x:
                times,

            y:
                askValues,

            type:
                "scatter",

            mode:
                "lines",

            name:
                "ASK — aggressive BUY",


            line: {

                color:
                    "#a66b3f",

                width:
                    1.6
            },


            hovertemplate:

                "ASK: %{y:,.0f}" +
                "<extra></extra>"
        },


        {

            x:
                times,

            y:
                bidValues,

            type:
                "scatter",

            mode:
                "lines",

            name:
                "BID — aggressive SELL",


            line: {

                color:
                    "#35c77a",

                width:
                    1.6
            },


            hovertemplate:

                "BID: %{y:,.0f}" +
                "<extra></extra>"
        }

    ];


    const layout =
        baseLayout();


    /*
       У верхнего графика
       время снизу не обязательно.
       Оставляем немного места.
    */

    layout.margin.b =
        10;


    Plotly.newPlot(

        "flowChart",

        traces,

        layout,

        {

            responsive:
                true,

            scrollZoom:
                true,

            displaylogo:
                false,

            displayModeBar:
                true,

            modeBarButtons: [

                [

                    "zoom2d",

                    "pan2d",

                    "resetScale2d"

                ]

            ],

            doubleClick:
                "reset",

            /*
               Убираем лишний
               Plotly UI насколько возможно.
            */

            showTips:
                false
        }

    ).then(
        setupRightMousePan
    );
}


/* =====================================================
   DELTA GRAPH
===================================================== */

function drawDelta() {

    const times =
        data.map(
            x => x.time
        );


    const delta =
        data.map(
            x =>
                getDelta(
                    x.ask,
                    x.bid
                )
        );


    const layout =
        baseLayout();


    layout.showlegend =
        false;


    layout.margin = {

        l:
            50,

        r:
            65,

        t:
            5,

        b:
            30
    };


    layout.yaxis = {

        side:
            "right",


        showgrid:
            true,

        gridcolor:
            GRID,


        zeroline:
            true,

        zerolinecolor:
            "#444b52",

        zerolinewidth:
            1,


        linecolor:
            AXIS,


        tickfont: {

            color:
                TEXT
        },


        ticksuffix:
            "%",


        showspikes:
            true,

        spikemode:
            "across+marker",

        spikesnap:
            "cursor",

        spikecolor:
            CROSS,

        spikethickness:
            1,

        spikedash:
            "dot",


        fixedrange:
            false
    };


    layout.xaxis = {

        type:
            "date",


        showgrid:
            true,

        gridcolor:
            GRID,


        linecolor:
            AXIS,


        tickfont: {

            color:
                "#858d95"
        },


        rangeslider: {

            visible:
                false
        },


        showspikes:
            true,

        spikemode:
            "across+marker",

        spikesnap:
            "cursor",

        spikecolor:
            CROSS,

        spikethickness:
            1,

        spikedash:
            "dot",


        fixedrange:
            false
    };


    Plotly.newPlot(

        "deltaChart",

        [

            {

                x:
                    times,

                y:
                    delta,

                type:
                    "scatter",

                mode:
                    "lines",

                name:
                    "DELTA",


                line: {

                    color:
                        "#27d9d9",

                    width:
                        1.6
                },


                hovertemplate:

                    "DELTA: %{y:.2f}%" +
                    "<extra></extra>"
            }

        ],

        layout,

        {

            responsive:
                true,

            scrollZoom:
                true,

            displaylogo:
                false,

            displayModeBar:
                true,

            modeBarButtons: [

                [

                    "zoom2d",

                    "pan2d",

                    "resetScale2d"

                ]

            ],

            doubleClick:
                "reset",

            showTips:
                false
        }

    ).then(
        setupRightMousePan
    );
}


/* =====================================================
   СИНХРОНИЗАЦИЯ ГРАФИКОВ
===================================================== */

let syncing =
    false;


function syncCharts(
    sourceId,
    event
) {

    if (
        syncing
    ) {

        return;
    }


    if (
        !event ||
        !event["xaxis.range[0]"]
    ) {

        return;
    }


    syncing =
        true;


    const range = [

        event[
            "xaxis.range[0]"
        ],

        event[
            "xaxis.range[1]"
        ]

    ];


    const targetId =
        sourceId ===
        "flowChart"

            ? "deltaChart"

            : "flowChart";


    Plotly.relayout(

        targetId,

        {

            "xaxis.range":
                range

        }

    ).then(
        () => {

            syncing =
                false;

        }

    );

}


/* =====================================================
   RIGHT MOUSE PAN
===================================================== */

function setupRightMousePan(
    gd
) {

    let active =
        false;

    let startX =
        0;

    let startY =
        0;

    let originalX =
        null;

    let originalY =
        null;


    gd.addEventListener(

        "contextmenu",

        function(e) {

            e.preventDefault();

        }

    );


    gd.addEventListener(

        "mousedown",

        function(e) {

            /*
               Только правая кнопка.
            */

            if (
                e.button !== 2
            ) {

                return;
            }


            e.preventDefault();


            const full =
                gd._fullLayout;


            const xaxis =
                full.xaxis;


            const yaxis =
                full.yaxis;


            originalX =
                xaxis.range
                    ? [
                        xaxis.range[0],
                        xaxis.range[1]
                    ]
                    : null;


            originalY =
                yaxis.range
                    ? [
                        yaxis.range[0],
                        yaxis.range[1]
                    ]
                    : null;


            startX =
                e.clientX;


            startY =
                e.clientY;


            active =
                true;


            gd.style.cursor =
                "grabbing";

        }

    );


    document.addEventListener(

        "mousemove",

        function(e) {

            if (
                !active
            ) {

                return;
            }


            if (
                !originalX ||
                !originalY
            ) {

                return;
            }


            const full =
                gd._fullLayout;


            const xaxis =
                full.xaxis;


            const yaxis =
                full.yaxis;


            const dx =
                e.clientX -
                startX;


            const dy =
                e.clientY -
                startY;


            /*
               Перевод пикселей
               в диапазон данных.
            */

            const plotWidth =
                xaxis._length;


            const plotHeight =
                yaxis._length;


            const xSpan =
                new Date(
                    originalX[1]
                ).getTime() -
                new Date(
                    originalX[0]
                ).getTime();


            const ySpan =
                originalY[1] -
                originalY[0];


            const xShift =
                -(dx / plotWidth) *
                xSpan;


            const yShift =
                (dy / plotHeight) *
                ySpan;


            const newX0 =
                new Date(
                    new Date(
                        originalX[0]
                    ).getTime() +
                    xShift
                );


            const newX1 =
                new Date(
                    new Date(
                        originalX[1]
                    ).getTime() +
                    xShift
                );


            const newY0 =
                originalY[0] +
                yShift;


            const newY1 =
                originalY[1] +
                yShift;


            Plotly.relayout(

                gd,

                {

                    "xaxis.range":
                        [
                            newX0,
                            newX1
                        ],

                    "yaxis.range":
                        [
                            newY0,
                            newY1
                        ]

                }

            );

        }

    );


    document.addEventListener(

        "mouseup",

        function(e) {

            if (
                !active
            ) {

                return;
            }


            if (
                e.button === 2
            ) {

                active =
                    false;


                gd.style.cursor =
                    "default";
            }

        }

    );

}


/* =====================================================
   ЦИКЛЫ
===================================================== */

function setRange(
    hours,
    button
) {

    document
        .querySelectorAll(
            ".cycle"
        )
        .forEach(
            x =>
                x.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    const last =
        data[
            data.length - 1
        ].time;


    const first =
        new Date(

            last.getTime() -
            hours *
            60 *
            60 *
            1000

        );


    const range = [

        first,

        last

    ];


    syncing =
        true;


    Promise.all([

        Plotly.relayout(

            "flowChart",

            {
                "xaxis.range":
                    range
            }

        ),

        Plotly.relayout(

            "deltaChart",

            {
                "xaxis.range":
                    range
            }

        )

    ]).then(

        () => {

            syncing =
                false;

        }

    );

}


/* =====================================================
   ВСЯ ИСТОРИЯ
===================================================== */

function showAll(
    button
) {

    document
        .querySelectorAll(
            ".cycle"
        )
        .forEach(
            x =>
                x.classList.remove(
                    "active"
                )
        );


    button.classList.add(
        "active"
    );


    syncing =
        true;


    Promise.all([

        Plotly.relayout(

            "flowChart",

            {
                "xaxis.autorange":
                    true
            }

        ),

        Plotly.relayout(

            "deltaChart",

            {
                "xaxis.autorange":
                    true
            }

        )

    ]).then(

        () => {

            syncing =
                false;

        }

    );

}


/* =====================================================
   RESET
===================================================== */

function resetCharts() {

    document
        .querySelectorAll(
            ".cycle"
        )
        .forEach(
            x =>
                x.classList.remove(
                    "active"
                )
        );


    syncing =
        true;


    Promise.all([

        Plotly.relayout(

            "flowChart",

            {

                "xaxis.autorange":
                    true,

                "yaxis.autorange":
                    true

            }

        ),

        Plotly.relayout(

            "deltaChart",

            {

                "xaxis.autorange":
                    true,

                "yaxis.autorange":
                    true

            }

        )

    ]).then(

        () => {

            syncing =
                false;

        }

    );

}
