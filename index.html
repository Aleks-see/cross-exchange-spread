<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BINANCE FLOW ANALYZER</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        background: #111;
        color: #eee;
        font-family: Arial, sans-serif;
    }

    .header {
        padding: 16px;
        text-align: center;
        font-size: 24px;
        font-weight: bold;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 0 10px 10px;
    }

    .stat {
        background: #1b1b1b;
        border-radius: 8px;
        padding: 10px;
        text-align: center;
    }

    .title {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 5px;
    }

    .value {
        font-size: 17px;
        font-weight: bold;
    }

    .ask {
        color: #c48a5a;
    }

    .bid {
        color: #35c77a;
    }

    .delta {
        color: #27d9d9;
    }

    .time {
        text-align: center;
        color: #888;
        font-size: 12px;
        padding-bottom: 8px;
    }

    .graph {
        width: 100%;
        height: 52vh;
    }

    .deltaGraph {
        width: 100%;
        height: 42vh;
    }

    .controls {
        display: flex;
        gap: 6px;
        padding: 8px;
        overflow-x: auto;
        background: #151515;
        position: sticky;
        top: 0;
        z-index: 10;
    }

    button {
        flex: 0 0 auto;
        background: #292929;
        color: #eee;
        border: 1px solid #444;
        border-radius: 6px;
        padding: 9px 13px;
        font-size: 13px;
    }

    button:active {
        background: #444;
    }
</style>
</head>

<body>

<div class="header">
    BINANCE FLOW ANALYZER
</div>

<div class="stats">

    <div class="stat">
        <div class="title ask">ASK BUY</div>
        <div class="value" id="askCount">0 trades</div>
        <div class="title" id="askUsd">$0</div>
    </div>

    <div class="stat">
        <div class="title bid">BID SELL</div>
        <div class="value" id="bidCount">0 trades</div>
        <div class="title" id="bidUsd">$0</div>
    </div>

    <div class="stat">
        <div class="title delta">DELTA</div>
        <div class="value delta" id="deltaValue">0.00%</div>
    </div>

</div>

<div class="time" id="lastUpdate">
    Demo data
</div>

<!-- Управление временем -->
<div class="controls">

    <button onclick="zoomHours(1)">
        1H
    </button>

    <button onclick="zoomHours(2)">
        2H
    </button>

    <button onclick="zoomHours(4)">
        4H
    </button>

    <button onclick="zoomHours(6)">
        6H
    </button>

    <button onclick="zoomHours(12)">
        12H
    </button>

    <button onclick="showAll()">
        ВСЁ
    </button>

    <button onclick="resetZoom()">
        RESET
    </button>

</div>

<div id="flowGraph" class="graph"></div>

<div id="deltaGraph" class="deltaGraph"></div>


<script>

/* =========================================================
   DEMO DATA
   Пока тестируем только интерфейс.
   Потом сюда подключим flow.py.
   ========================================================= */

const data = [];

const start = new Date();
start.setHours(start.getHours() - 6);

let ask = 0;
let bid = 0;
let askUsd = 0;
let bidUsd = 0;

for (let i = 0; i < 360; i++) {

    const t = new Date(start.getTime() + i * 60 * 1000);

    ask += Math.floor(250 + Math.random() * 200);
    bid += Math.floor(250 + Math.random() * 200);

    askUsd += 350000 + Math.random() * 250000;
    bidUsd += 350000 + Math.random() * 250000;

    const delta =
        bid === 0
            ? 0
            : ((ask - bid) / bid) * 100;

    data.push({
        time: t,
        ask: ask,
        bid: bid,
        askUsd: askUsd,
        bidUsd: bidUsd,
        delta: delta
    });
}


/* =========================================================
   ФОРМАТИРОВАНИЕ
   ========================================================= */

function money(value) {

    if (value >= 1e9)
        return "$" + (value / 1e9).toFixed(2) + "B";

    if (value >= 1e6)
        return "$" + (value / 1e6).toFixed(2) + "M";

    if (value >= 1e3)
        return "$" + (value / 1e3).toFixed(1) + "K";

    return "$" + value.toFixed(0);
}


/* =========================================================
   ОБНОВЛЕНИЕ СТАТИСТИКИ
   ========================================================= */

function updateStats() {

    const last = data[data.length - 1];

    document.getElementById("askCount").innerText =
        last.ask.toLocaleString() + " trades";

    document.getElementById("bidCount").innerText =
        last.bid.toLocaleString() + " trades";

    document.getElementById("askUsd").innerText =
        money(last.askUsd);

    document.getElementById("bidUsd").innerText =
        money(last.bidUsd);

    document.getElementById("deltaValue").innerText =
        (last.delta >= 0 ? "+" : "") +
        last.delta.toFixed(2) +
        "%";

    document.getElementById("lastUpdate").innerText =
        "Последнее обновление: " +
        last.time.toLocaleTimeString();
}


/* =========================================================
   ГРАФИК ASK / BID
   ========================================================= */

function drawFlow() {

    const times = data.map(x => x.time);
    const asks = data.map(x => x.ask);
    const bids = data.map(x => x.bid);

    const traces = [

        {
            x: times,
            y: asks,
            mode: "lines",
            name: "ASK — aggressive BUY",
            line: {
                color: "#a66b3f",
                width: 2
            }
        },

        {
            x: times,
            y: bids,
            mode: "lines",
            name: "BID — aggressive SELL",
            line: {
                color: "#35c77a",
                width: 2
            }
        }

    ];

    const layout = {

        paper_bgcolor: "#111",
        plot_bgcolor: "#111",

        margin: {
            l: 55,
            r: 15,
            t: 35,
            b: 55
        },

        font: {
            color: "#aaa"
        },

        hovermode: "x unified",

        dragmode: "zoom",

        xaxis: {
            type: "date",
            showgrid: true,
            gridcolor: "#292929",
            rangeslider: {
                visible: true,
                thickness: 0.08
            }
        },

        yaxis: {
            showgrid: true,
            gridcolor: "#292929",
            fixedrange: false
        },

        legend: {
            orientation: "h"
        }
    };

    const config = {

        responsive: true,

        displayModeBar: true,

        scrollZoom: true,

        doubleClick: "reset",

        modeBarButtonsToAdd: [
            "zoomIn2d",
            "zoomOut2d",
            "pan2d",
            "resetScale2d"
        ],

        displaylogo: false
    };

    Plotly.newPlot(
        "flowGraph",
        traces,
        layout,
        config
    );
}


/* =========================================================
   DELTA
   ========================================================= */

function drawDelta() {

    const times = data.map(x => x.time);
    const delta = data.map(x => x.delta);

    const trace = {

        x: times,
        y: delta,

        mode: "lines",

        name: "DELTA",

        line: {
            color: "#27d9d9",
            width: 2
        }

    };

    const layout = {

        paper_bgcolor: "#111",
        plot_bgcolor: "#111",

        margin: {
            l: 55,
            r: 15,
            t: 35,
            b: 55
        },

        font: {
            color: "#aaa"
        },

        hovermode: "x unified",

        dragmode: "zoom",

        xaxis: {
            type: "date",
            showgrid: true,
            gridcolor: "#292929",
            rangeslider: {
                visible: true,
                thickness: 0.08
            }
        },

        yaxis: {
            showgrid: true,
            gridcolor: "#292929",
            zeroline: true,
            zerolinecolor: "#555"
        }
    };

    const config = {

        responsive: true,

        displayModeBar: true,

        scrollZoom: true,

        doubleClick: "reset",

        modeBarButtonsToAdd: [
            "zoomIn2d",
            "zoomOut2d",
            "pan2d",
            "resetScale2d"
        ],

        displaylogo: false
    };

    Plotly.newPlot(
        "deltaGraph",
        [trace],
        layout,
        config
    );
}


/* =========================================================
   УВЕЛИЧЕНИЕ ПО ВРЕМЕНИ
   ========================================================= */

function zoomHours(hours) {

    const end =
        data[data.length - 1].time;

    const start =
        new Date(
            end.getTime() -
            hours * 60 * 60 * 1000
        );

    Plotly.relayout(
        "flowGraph",
        {
            "xaxis.range": [
                start,
                end
            ]
        }
    );

    Plotly.relayout(
        "deltaGraph",
        {
            "xaxis.range": [
                start,
                end
            ]
        }
    );
}


/* =========================================================
   ПОКАЗАТЬ ВСЁ
   ========================================================= */

function showAll() {

    const start = data[0].time;
    const end = data[data.length - 1].time;

    Plotly.relayout(
        "flowGraph",
        {
            "xaxis.range": [
                start,
                end
            ]
        }
    );

    Plotly.relayout(
        "deltaGraph",
        {
            "xaxis.range": [
                start,
                end
            ]
        }
    );
}


/* =========================================================
   RESET
   ========================================================= */

function resetZoom() {

    Plotly.relayout(
        "flowGraph",
        {
            "xaxis.autorange": true
        }
    );

    Plotly.relayout(
        "deltaGraph",
        {
            "xaxis.autorange": true
        }
    );
}


/* =========================================================
   ЗАПУСК
   ========================================================= */

updateStats();
drawFlow();
drawDelta();

</script>

</body>
</html>
