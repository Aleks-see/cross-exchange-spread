<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Flow Terminal</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: #0b0e11;
    color: #d6d9dc;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
}

body {
    display: flex;
    flex-direction: column;
}

/* ================= HEADER ================= */

.header {
    height: 54px;
    min-height: 54px;

    display: flex;
    align-items: center;
    gap: 10px;

    padding: 7px 12px;

    background: #111418;
    border-bottom: 1px solid #252a30;
}

.logo {
    font-size: 16px;
    font-weight: bold;
    color: #e6e8eb;
    margin-right: 8px;
}

.input {
    height: 34px;

    background: #090b0e;
    border: 1px solid #343a41;
    border-radius: 4px;

    color: #e5e7ea;

    padding: 0 10px;

    font-size: 14px;

    outline: none;

    width: 125px;
}

.input:focus {
    border-color: #59636e;
}

.date {
    width: 120px;
}

.time {
    width: 80px;
}

button {
    height: 34px;

    background: #191d22;
    color: #d8dadd;

    border: 1px solid #343a41;
    border-radius: 4px;

    padding: 0 12px;

    cursor: pointer;

    font-size: 13px;
}

button:hover {
    background: #252a30;
}

.load {
    background: #1d252b;
}

/* ================= STATS ================= */

.stats {
    height: 44px;
    min-height: 44px;

    display: flex;
    align-items: center;

    gap: 25px;

    padding: 0 15px;

    background: #0d1013;
    border-bottom: 1px solid #20252a;

    font-size: 12px;
}

.stat {
    display: flex;
    gap: 7px;
    align-items: center;
}

.stat-name {
    color: #777e86;
}

.ask {
    color: #b47b50;
}

.bid {
    color: #39c77b;
}

.delta {
    color: #25d7d7;
}

/* ================= CYCLES ================= */

.cycles {
    height: 40px;
    min-height: 40px;

    display: flex;
    align-items: center;

    gap: 5px;

    padding: 4px 10px;

    background: #111418;
    border-bottom: 1px solid #252a30;
}

.cycle {
    height: 29px;

    padding: 0 11px;

    background: transparent;

    border: 0;
    border-radius: 3px;

    color: #858c94;
}

.cycle:hover {
    background: #1c2126;
    color: #ddd;
}

.cycle.active {
    background: #283038;
    color: #f0f1f2;
}

/* ================= CHART AREA ================= */

#charts {
    flex: 1;

    min-height: 0;

    display: flex;
    flex-direction: column;
}

#flowChart {
    flex: 7;
    min-height: 0;
}

#deltaChart {
    flex: 3;
    min-height: 0;

    border-top: 1px solid #292e33;
}

/* ================= MOBILE ================= */

@media (max-width: 700px) {

    .header {
        height: auto;
        min-height: 50px;

        flex-wrap: wrap;

        padding: 7px;
    }

    .logo {
        width: 100%;
        margin-bottom: 2px;
    }

    .input {
        width: 105px;
    }

    .date {
        width: 105px;
    }

    .time {
        width: 65px;
    }

    .stats {
        gap: 12px;
        padding: 0 8px;
        font-size: 10px;
    }

    .cycles {
        overflow-x: auto;
        white-space: nowrap;
    }

    .cycle {
        flex-shrink: 0;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     HEADER
===================================================== -->

<div class="header">

    <div class="logo">
        FLOW
    </div>

    <input
        id="symbol"
        class="input"
        value="BTCUSDT"
        placeholder="Инструмент"
    >

    <input
        id="date"
        class="input date"
        type="date"
    >

    <input
        id="startTime"
        class="input time"
        type="time"
        value="09:00"
    >

    <button class="load" onclick="loadDemo()">
        ЗАГРУЗИТЬ
    </button>

</div>


<!-- =====================================================
     STATS
===================================================== -->

<div class="stats">

    <div class="stat">
        <span class="stat-name">ASK</span>
        <span class="ask" id="askStats">0 trades | $0</span>
    </div>

    <div class="stat">
        <span class="stat-name">BID</span>
        <span class="bid" id="bidStats">0 trades | $0</span>
    </div>

    <div class="stat">
        <span class="stat-name">DELTA</span>
        <span class="delta" id="deltaStats">0.00%</span>
    </div>

</div>


<!-- =====================================================
     TIME CYCLES
===================================================== -->

<div class="cycles">

    <button class="cycle" onclick="setRange(1, this)">
        1H
    </button>

    <button class="cycle" onclick="setRange(2, this)">
        2H
    </button>

    <button class="cycle" onclick="setRange(4, this)">
        4H
    </button>

    <button class="cycle active" onclick="setRange(6, this)">
        6H
    </button>

    <button class="cycle" onclick="setRange(12, this)">
        12H
    </button>

    <button class="cycle" onclick="showAll(this)">
        ВСЁ
    </button>

</div>


<!-- =====================================================
     CHARTS
===================================================== -->

<div id="charts">

    <div id="flowChart"></div>

    <div id="deltaChart"></div>

</div>


<script>

/* =====================================================
   DEMO DATA
===================================================== */

let data = [];

const now = new Date();

const start =
    new Date(now.getTime() - 12 * 60 * 60 * 1000);

let ask = 0;
let bid = 0;

let askUsd = 0;
let bidUsd = 0;


for (let i = 0; i <= 720; i++) {

    const time =
        new Date(start.getTime() + i * 60 * 1000);

    /*
       Небольшая корреляция между потоками,
       чтобы график выглядел естественнее.
    */

    const wave =
        Math.sin(i / 35) * 25;

    ask += 300 + wave + Math.random() * 100;

    bid += 300 - wave + Math.random() * 100;

    askUsd +=
        2200000 +
        Math.random() * 700000;

    bidUsd +=
        2200000 +
        Math.random() * 700000;


    data.push({

        time,

        ask,

        bid,

        askUsd,

        bidUsd

    });
}


/* =====================================================
   DELTA
===================================================== */

function getDelta(a, b) {

    if (b === 0) {
        return 0;
    }

    return ((a - b) / b) * 100;
}


/* =====================================================
   FORMAT MONEY
===================================================== */

function money(value) {

    if (value >= 1e9) {

        return "$" +
            (value / 1e9).toFixed(2) +
            "B";

    }

    if (value >= 1e6) {

        return "$" +
            (value / 1e6).toFixed(2) +
            "M";

    }

    if (value >= 1e3) {

        return "$" +
            (value / 1e3).toFixed(1) +
            "K";

    }

    return "$" +
        value.toFixed(0);
}


/* =====================================================
   UPDATE STATS
===================================================== */

function updateStats() {

    const last =
        data[data.length - 1];

    const delta =
        getDelta(last.ask, last.bid);


    document.getElementById(
        "askStats"
    ).textContent =
        Math.round(last.ask).toLocaleString() +
        " trades | " +
        money(last.askUsd);


    document.getElementById(
        "bidStats"
    ).textContent =
        Math.round(last.bid).toLocaleString() +
        " trades | " +
        money(last.bidUsd);


    document.getElementById(
        "deltaStats"
    ).textContent =
        (delta >= 0 ? "+" : "") +
        delta.toFixed(2) +
        "%";
}


/* =====================================================
   COMMON TERMINAL STYLE
===================================================== */

const axisColor = "#6e757d";

const gridColor = "#1c2126";


const baseLayout = {

    paper_bgcolor: "#0b0e11",

    plot_bgcolor: "#0b0e11",

    margin: {
        l: 55,
        r: 65,
        t: 8,
        b: 30
    },

    font: {
        family: "Arial",
        color: "#9aa1a8",
        size: 11
    },

    hovermode: "x",

    dragmode: "pan",

    xaxis: {

        type: "date",

        showgrid: true,

        gridcolor: gridColor,

        linecolor: "#252a30",

        tickfont: {
            color: "#727980"
        },

        rangeslider: {
            visible: false
        },

        fixedrange: false
    },

    yaxis: {

        side: "right",

        showgrid: true,

        gridcolor: gridColor,

        zeroline: false,

        linecolor: "#252a30",

        tickfont: {
            color: "#727980"
        },

        fixedrange: false
    }
};


/* =====================================================
   FLOW GRAPH
===================================================== */

function drawFlow() {

    const times =
        data.map(x => x.time);

    const ask =
        data.map(x => x.ask);

    const bid =
        data.map(x => x.bid);


    const traces = [

        {
            x: times,
            y: ask,

            type: "scatter",
            mode: "lines",

            name: "ASK",

            line: {
                color: "#a66b3f",
                width: 1.5
            },

            hovertemplate:
                "ASK: %{y:,.0f}<extra></extra>"
        },


        {
            x: times,
            y: bid,

            type: "scatter",
            mode: "lines",

            name: "BID",

            line: {
                color: "#35c77a",
                width: 1.5
            },

            hovertemplate:
                "BID: %{y:,.0f}<extra></extra>"
        }

    ];


    Plotly.newPlot(
        "flowChart",
        traces,
        baseLayout,
        {

            responsive: true,

            scrollZoom: true,

            displaylogo: false,

            displayModeBar: true,

            modeBarButtons: [

                [
                    "zoom2d",
                    "pan2d",
                    "resetScale2d"
                ]

            ],

            doubleClick:
                "reset"
        }
    );
}


/* =====================================================
   DELTA GRAPH
===================================================== */

function drawDelta() {

    const times =
        data.map(x => x.time);

    const delta =
        data.map(x =>
            getDelta(x.ask, x.bid)
        );


    const layout =
        JSON.parse(
            JSON.stringify(baseLayout)
        );


    layout.margin = {

        l: 55,
        r: 65,
        t: 5,
        b: 30

    };


    layout.yaxis = {

        side: "right",

        showgrid: true,

        gridcolor: gridColor,

        zeroline: true,

        zerolinecolor: "#3a4046",

        tickfont: {
            color: "#727980"
        },

        ticksuffix: "%",

        fixedrange: false
    };


    Plotly.newPlot(
        "deltaChart",

        [

            {

                x: times,

                y: delta,

                type: "scatter",

                mode: "lines",

                name: "DELTA",

                line: {

                    color: "#27d9d9",

                    width: 1.5

                },

                hovertemplate:
                    "DELTA: %{y:.2f}%<extra></extra>"
            }

        ],

        layout,

        {

            responsive: true,

            scrollZoom: true,

            displaylogo: false,

            displayModeBar: true,

            modeBarButtons: [

                [
                    "zoom2d",
                    "pan2d",
                    "resetScale2d"
                ]

            ],

            doubleClick:
                "reset"
        }
    );
}


/* =====================================================
   TIME RANGE
===================================================== */

function setRange(hours, button) {

    document
        .querySelectorAll(".cycle")
        .forEach(x =>
            x.classList.remove("active")
        );

    button.classList.add("active");


    const last =
        data[data.length - 1].time;

    const first =
        new Date(
            last.getTime() -
            hours * 60 * 60 * 1000
        );


    Plotly.relayout(
        "flowChart",
        {
            "xaxis.range":
                [first, last]
        }
    );


    Plotly.relayout(
        "deltaChart",
        {
            "xaxis.range":
                [first, last]
        }
    );
}


/* =====================================================
   SHOW ALL
===================================================== */

function showAll(button) {

    document
        .querySelectorAll(".cycle")
        .forEach(x =>
            x.classList.remove("active")
        );

    button.classList.add("active");


    Plotly.relayout(
        "flowChart",
        {
            "xaxis.autorange": true
        }
    );


    Plotly.relayout(
        "deltaChart",
        {
            "xaxis.autorange": true
        }
    );
}


/* =====================================================
   DEMO LOAD
===================================================== */

function loadDemo() {

    /*
       Пока просто перерисовываем демо.

       Позже здесь будет запрос
       к нашему закрытому серверу.
    */

    updateStats();

    Plotly.react(
        "flowChart",
        Plotly
            .getDataByDiv("flowChart"),
        Plotly
            .getLayoutByDiv("flowChart")
    );
}


/* =====================================================
   START
===================================================== */

updateStats();

drawFlow();

drawDelta();


/*
   Начальное отображение — 6 часов.
*/

setTimeout(() => {

    const buttons =
        document.querySelectorAll(".cycle");

    setRange(6, buttons[3]);

}, 300);

</script>

</body>
</html>
