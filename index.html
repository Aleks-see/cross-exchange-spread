<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BINANCE FLOW ANALYZER</title>

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

<style>
    * {
        box-sizing: border-box;
    }

    html, body {
        margin: 0;
        padding: 0;
        background: #080808;
        color: #ddd;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
    }

    .container {
        width: 100%;
        padding: 10px;
    }

    h1 {
        text-align: center;
        margin: 5px 0 15px;
        font-size: 22px;
        color: #eee;
    }

    .stats {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        margin-bottom: 8px;
    }

    .card {
        background: #111;
        border: 1px solid #222;
        border-radius: 8px;
        padding: 10px;
        text-align: center;
    }

    .title {
        font-size: 13px;
        color: #aaa;
        margin-bottom: 5px;
    }

    .value {
        font-size: 18px;
        font-weight: bold;
    }

    .sub {
        font-size: 12px;
        color: #999;
        margin-top: 4px;
    }

    .controls {
        display: flex;
        gap: 7px;
        flex-wrap: wrap;
        margin: 8px 0;
    }

    button {
        background: #222;
        color: #eee;
        border: 1px solid #444;
        border-radius: 5px;
        padding: 8px 14px;
        cursor: pointer;
        font-size: 13px;
    }

    button:hover {
        background: #333;
    }

    .info {
        text-align: center;
        color: #888;
        font-size: 12px;
        margin: 4px 0 8px;
    }

    .chart {
        width: 100%;
        height: 520px;
        margin-bottom: 15px;
    }

    @media (max-width: 700px) {
        .stats {
            grid-template-columns: 1fr;
        }

        .chart {
            height: 430px;
        }

        h1 {
            font-size: 18px;
        }
    }
</style>
</head>

<body>

<div class="container">

    <h1>BINANCE FLOW ANALYZER</h1>

    <div class="stats">

        <div class="card">
            <div class="title">ASK BUY — aggressive BUY</div>
            <div class="value" id="askCount">0 trades</div>
            <div class="sub" id="askUsd">$0</div>
        </div>

        <div class="card">
            <div class="title">BID SELL — aggressive SELL</div>
            <div class="value" id="bidCount">0 trades</div>
            <div class="sub" id="bidUsd">$0</div>
        </div>

        <div class="card">
            <div class="title">DELTA</div>
            <div class="value" id="deltaValue">0%</div>
            <div class="sub">ASK vs BID</div>
        </div>

    </div>

    <div class="info">
        Последнее обновление:
        <span id="lastUpdate">--:--:--</span>
    </div>

    <div class="controls">
        <button onclick="zoomHours(1)">1H</button>
        <button onclick="zoomHours(2)">2H</button>
        <button onclick="zoomHours(4)">4H</button>
        <button onclick="zoomHours(6)">6H</button>
        <button onclick="zoomHours(12)">12H</button>
        <button onclick="showAll()">ВСЁ</button>
        <button onclick="resetZoom()">RESET</button>
    </div>

    <div id="flowChart" class="chart"></div>

    <div id="deltaChart" class="chart"></div>

</div>

<script>

/* =========================================================
   DEMO DATA
   ========================================================= */

const points = [];

const now = new Date();
const start = new Date(now.getTime() - 6 * 60 * 60 * 1000);

let ask = 0;
let bid = 0;
let askUsd = 0;
let bidUsd = 0;

for (let i = 0; i <= 360; i++) {

    const t = new Date(start.getTime() + i * 60 * 1000);

    ask += 320 + Math.floor(Math.random() * 90);
    bid += 315 + Math.floor(Math.random() * 90);

    askUsd += 2500000 + Math.random() * 900000;
    bidUsd += 2450000 + Math.random() * 900000;

    points.push({
        time: t,
        ask: ask,
        bid: bid,
        askUsd: askUsd,
        bidUsd: bidUsd
    });
}


/* =========================================================
   HELPERS
   ========================================================= */

function deltaPercent(ask, bid) {

    if (!bid) {
        return 0;
    }

    return ((ask - bid) / bid) * 100;
}


function money(value) {

    if (value >= 1000000000) {
        return "$" + (value / 1000000000).toFixed(2) + "B";
    }

    if (value >= 1000000) {
        return "$" + (value / 1000000).toFixed(2) + "M";
    }

    if (value >= 1000) {
        return "$" + (value / 1000).toFixed(1) + "K";
    }

    return "$" + value.toFixed(0);
}


/* =========================================================
   STATS
   ========================================================= */

function updateStats() {

    const last = points[points.length - 1];

    const delta = deltaPercent(last.ask, last.bid);

    document.getElementById("askCount").textContent =
        last.ask.toLocaleString() + " trades";

    document.getElementById("bidCount").textContent =
        last.bid.toLocaleString() + " trades";

    document.getElementById("askUsd").textContent =
        money(last.askUsd);

    document.getElementById("bidUsd").textContent =
        money(last.bidUsd);

    document.getElementById("deltaValue").textContent =
        (delta >= 0 ? "+" : "") + delta.toFixed(2) + "%";

    document.getElementById("lastUpdate").textContent =
        last.time.toLocaleTimeString();
}


/* =========================================================
   COMMON PLOT SETTINGS
   ========================================================= */

const commonLayout = {

    paper_bgcolor: "#080808",
    plot_bgcolor: "#080808",

    font: {
        color: "#ccc"
    },

    margin: {
        l: 55,
        r: 20,
        t: 20,
        b: 55
    },

    hovermode: "x unified",

    dragmode: "zoom",

    xaxis: {

        type: "date",

        showgrid: true,

        gridcolor: "#222",

        zeroline: false,

        rangeslider: {
            visible: true,
            bgcolor: "#050505",
            bordercolor: "#222"
        }
    },

    yaxis: {

        showgrid: true,

        gridcolor: "#222",

        zeroline: false
    }
};


/* =========================================================
   FLOW GRAPH
   ========================================================= */

function drawFlow() {

    const times = points.map(p => p.time);

    const askData = points.map(p => p.ask);

    const bidData = points.map(p => p.bid);

    const data = [

        {
            x: times,
            y: askData,
            type: "scatter",
            mode: "lines",
            name: "ASK — aggressive BUY",
            line: {
                color: "#a66b3f",
                width: 2
            }
        },

        {
            x: times,
            y: bidData,
            type: "scatter",
            mode: "lines",
            name: "BID — aggressive SELL",
            line: {
                color: "#35c77a",
                width: 2
            }
        }

    ];

    const layout = JSON.parse(JSON.stringify(commonLayout));

    layout.title = {
        text: "",
        font: {
            size: 1
        }
    };

    Plotly.newPlot(
        "flowChart",
        data,
        layout,
        {
            responsive: true,
            scrollZoom: true,

            displaylogo: false,

            doubleClick: "reset",

            modeBarButtonsToRemove: [
                "lasso2d",
                "select2d"
            ]
        }
    );
}


/* =========================================================
   DELTA GRAPH
   ========================================================= */

function drawDelta() {

    const times = points.map(p => p.time);

    const delta = points.map(p =>
        deltaPercent(p.ask, p.bid)
    );

    const data = [

        {
            x: times,
            y: delta,
            type: "scatter",
            mode: "lines",
            name: "DELTA",
            line: {
                color: "#27d9d9",
                width: 2
            }
        }

    ];

    const layout = JSON.parse(JSON.stringify(commonLayout));

    layout.yaxis = {

        showgrid: true,

        gridcolor: "#222",

        zeroline: true,

        zerolinecolor: "#555",

        tickformat: ".1f",

        ticksuffix: "%",

        title: {
            text: "%"
        }
    };

    Plotly.newPlot(
        "deltaChart",
        data,
        layout,
        {
            responsive: true,
            scrollZoom: true,

            displaylogo: false,

            doubleClick: "reset",

            modeBarButtonsToRemove: [
                "lasso2d",
                "select2d"
            ]
        }
    );
}


/* =========================================================
   TIME ZOOM BUTTONS
   ========================================================= */

function zoomHours(hours) {

    const last = points[points.length - 1].time;

    const first = new Date(
        last.getTime() - hours * 60 * 60 * 1000
    );

    const range = [first, last];

    Plotly.relayout(
        "flowChart",
        {
            "xaxis.range": range
        }
    );

    Plotly.relayout(
        "deltaChart",
        {
            "xaxis.range": range
        }
    );
}


function showAll() {

    const range = [
        points[0].time,
        points[points.length - 1].time
    ];

    Plotly.relayout(
        "flowChart",
        {
            "xaxis.autorange": true
        }
    );

    Plotly.relayout(
        "deltaChart",
        {
            "xaxis.autorange": true
        }
    );
}


function resetZoom() {

    Plotly.relayout(
        "flowChart",
        {
            "xaxis.autorange": true,
            "yaxis.autorange": true
        }
    );

    Plotly.relayout(
        "deltaChart",
        {
            "xaxis.autorange": true,
            "yaxis.autorange": true
        }
    );
}


/* =========================================================
   RIGHT MOUSE BUTTON = PAN
   ========================================================= */

function enableRightMousePan(chartId) {

    const chart = document.getElementById(chartId);

    let dragging = false;

    let lastX = 0;
    let lastY = 0;

    chart.addEventListener("contextmenu", function(event) {

        event.preventDefault();

    });


    chart.addEventListener("mousedown", function(event) {

        if (event.button !== 2) {
            return;
        }

        event.preventDefault();

        dragging = true;

        lastX = event.clientX;
        lastY = event.clientY;

        chart.style.cursor = "move";

    });


    window.addEventListener("mousemove", function(event) {

        if (!dragging) {
            return;
        }

        const dx = event.clientX - lastX;
        const dy = event.clientY - lastY;

        lastX = event.clientX;
        lastY = event.clientY;

        const gd = chart;

        const fullLayout = gd._fullLayout;

        if (!fullLayout) {
            return;
        }

        const xaxis = fullLayout.xaxis;
        const yaxis = fullLayout.yaxis;

        if (!xaxis || !yaxis) {
            return;
        }

        const currentXRange = xaxis.range.slice();

        const currentYRange = yaxis.range.slice();

        const xMin = new Date(currentXRange[0]).getTime();
        const xMax = new Date(currentXRange[1]).getTime();

        const yMin = currentYRange[0];
        const yMax = currentYRange[1];

        const xSpan = xMax - xMin;
        const ySpan = yMax - yMin;

        const xLength = xaxis._length;
        const yLength = yaxis._length;

        if (!xLength || !yLength) {
            return;
        }

        /*
         * Горизонтальное движение:
         *
         * мышь вправо
         * → график двигается вправо
         */

        const xShift =
            -(dx / xLength) * xSpan;


        /*
         * Вертикальное движение:
         *
         * мышь вниз
         * → график двигается вниз
         */

        const yShift =
            (dy / yLength) * ySpan;


        const newXRange = [

            new Date(xMin + xShift),

            new Date(xMax + xShift)

        ];


        const newYRange = [

            yMin + yShift,

            yMax + yShift

        ];


        Plotly.relayout(
            gd,
            {
                "xaxis.range": newXRange,
                "yaxis.range": newYRange
            }
        );

    });


    window.addEventListener("mouseup", function(event) {

        if (event.button !== 2) {
            return;
        }

        dragging = false;

        chart.style.cursor = "";

    });

}


/* =========================================================
   START
   ========================================================= */

updateStats();

drawFlow();

drawDelta();

enableRightMousePan("flowChart");

enableRightMousePan("deltaChart");

</script>

</body>
</html>
