<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cross-Exchange Futures Spread</title>

<script src="https://unpkg.com/lightweight-charts@4.2.3/dist/lightweight-charts.standalone.production.js"></script>

<style>
    html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #080d12;
        color: #fff;
        font-family: Arial, sans-serif;
        overflow: hidden;
    }

    #top {
        height: 85px;
        box-sizing: border-box;
        padding: 14px;
        border-bottom: 1px solid #202a35;
    }

    #title {
        font-size: 21px;
        font-weight: bold;
        margin-bottom: 12px;
    }

    select,
    input,
    button {
        height: 38px;
        box-sizing: border-box;
        border-radius: 6px;
        border: 1px solid #344352;
        background: #111923;
        color: #fff;
        padding: 0 14px;
        font-size: 14px;
    }

    select {
        width: 104px;
    }

    input {
        width: 194px;
        margin-left: 6px;
    }

    button {
        margin-left: 6px;
        cursor: pointer;
        background: #17212c;
    }

    button:hover {
        background: #22303d;
    }

    #main {
        display: flex;
        width: 100%;
        height: calc(100vh - 85px);
    }

    #info {
        width: 272px;
        min-width: 272px;
        box-sizing: border-box;
        padding: 30px 12px;
        border-right: 1px solid #202a35;
        overflow: hidden;
    }

    .exchange {
        font-size: 13px;
        color: #aab5c0;
        margin-bottom: 5px;
    }

    .quote {
        font-size: 16px;
        line-height: 20px;
        margin-bottom: 20px;
    }

    .separator {
        height: 1px;
        background: #202a35;
        margin: 10px 0 15px;
    }

    #spread {
        font-size: 29px;
        line-height: 35px;
        margin-top: 12px;
        margin-bottom: 28px;
    }

    #status {
        color: #9da9b5;
        font-size: 13px;
    }

    #chart {
        flex: 1;
        height: 100%;
        min-width: 0;
    }
</style>
</head>

<body>

<div id="top">

    <div id="title">
        Cross-Exchange Futures Spread
    </div>

    <div>
        <select id="exchange1">
            <option>BINANCE</option>
            <option>BYBIT</option>
            <option>MEXC</option>
            <option>GATE</option>
        </select>

        <input
            id="symbol"
            value="BTCUSDT"
            placeholder="NILUSDT"
        >

        <select id="exchange2">
            <option>BINANCE</option>
            <option>BYBIT</option>
            <option>MEXC</option>
            <option>GATE</option>
        </select>

        <button id="connect">
            Подключить
        </button>
    </div>

</div>


<div id="main">

    <div id="info">

        <div class="exchange" id="name1">
            BINANCE BTCUSDT
        </div>

        <div class="quote">
            Bid: <span id="bid1">—</span><br>
            Ask: <span id="ask1">—</span><br>
            Mid: <span id="mid1">—</span>
        </div>

        <div class="separator"></div>

        <div class="exchange" id="name2">
            BYBIT BTCUSDT
        </div>

        <div class="quote">
            Bid: <span id="bid2">—</span><br>
            Ask: <span id="ask2">—</span><br>
            Mid: <span id="mid2">—</span>
        </div>

        <div class="separator"></div>

        <div id="spread">
            SPREAD: —%
        </div>

        <div id="status">
            Ожидание подключения
        </div>

    </div>

    <div id="chart"></div>

</div>


<script>

let ws = null;

let chart = null;
let spreadSeries = null;

let firstPoint = true;


// =====================================================
// СОЗДАНИЕ ГРАФИКА
// =====================================================

function createChart() {

    const container = document.getElementById("chart");

    chart = LightweightCharts.createChart(
        container,
        {
            layout: {
                background: {
                    color: "#080d12"
                },

                textColor: "#9da9b5"
            },

            grid: {
                vertLines: {
                    color: "#18212b"
                },

                horzLines: {
                    color: "#18212b"
                }
            },

            rightPriceScale: {
                borderColor: "#202a35"
            },

            timeScale: {

                borderColor: "#202a35",

                timeVisible: true,

                secondsVisible: true,

                rightOffset: 5,

                barSpacing: 6,

                minBarSpacing: 1,

                fixLeftEdge: false,

                fixRightEdge: false,

                lockVisibleTimeRangeOnResize: false
            },

            crosshair: {
                mode: LightweightCharts.CrosshairMode.Normal
            }
        }
    );


    spreadSeries = chart.addLineSeries({

        color: "#00a8ff",

        lineWidth: 2,

        priceLineVisible: false,

        lastValueVisible: true
    });


    // Нулевая линия

    spreadSeries.createPriceLine({

        price: 0,

        color: "#0088cc",

        lineWidth: 1,

        lineStyle: LightweightCharts.LineStyle.Dotted,

        axisLabelVisible: true,

        title: "0"
    });


    window.addEventListener(
        "resize",
        resizeChart
    );
}


function resizeChart() {

    const container = document.getElementById("chart");

    if (!chart) {
        return;
    }

    chart.applyOptions({

        width: container.clientWidth,

        height: container.clientHeight

    });
}


// =====================================================
// ФОРМАТ ЧИСЛА
// =====================================================

function fmt(value) {

    if (
        value === null ||
        value === undefined ||
        !Number.isFinite(Number(value))
    ) {
        return "—";
    }

    return Number(value).toFixed(9);
}


// =====================================================
// ПЕРЕПОДКЛЮЧЕНИЕ
// =====================================================

function connect() {

    if (ws) {

        try {
            ws.close();
        } catch (e) {}

        ws = null;
    }


    spreadSeries.setData([]);

    firstPoint = true;


    const exchange1 =
        document.getElementById("exchange1").value;

    const exchange2 =
        document.getElementById("exchange2").value;

    let symbol =
        document.getElementById("symbol").value
        .trim()
        .toUpperCase();


    if (!symbol) {

        document.getElementById("status").textContent =
            "Введите тикер";

        return;
    }


    if (!symbol.endsWith("USDT")) {

        symbol += "USDT";

        document.getElementById("symbol").value =
            symbol;
    }


    document.getElementById("name1").textContent =
        exchange1 + " " + symbol;

    document.getElementById("name2").textContent =
        exchange2 + " " + symbol;


    document.getElementById("status").textContent =
        "Подключение...";


    const protocol =
        location.protocol === "https:"
        ? "wss:"
        : "ws:";


    ws = new WebSocket(
        protocol +
        "//" +
        location.host +
        "/ws"
    );


    ws.onopen = function() {

        document.getElementById("status").textContent =
            "Соединение установлено";


        ws.send(
            JSON.stringify({

                type: "config",

                exchange1: exchange1,

                exchange2: exchange2,

                symbol1: symbol,

                symbol2: symbol
            })
        );
    };


    ws.onmessage = function(event) {

        let data;

        try {

            data = JSON.parse(
                event.data
            );

        } catch (e) {

            return;
        }


        // =============================================
        // ОШИБКА / ДИАГНОСТИКА
        // =============================================

        if (data.type === "error") {

            document.getElementById("status").textContent =
                data.message || "Ошибка";

            return;
        }


        // =============================================
        // КОНФИГУРАЦИЯ
        // =============================================

        if (data.type === "config") {

            document.getElementById("name1").textContent =
                data.exchange1 +
                " " +
                data.symbol1;

            document.getElementById("name2").textContent =
                data.exchange2 +
                " " +
                data.symbol2;

            return;
        }


        // =============================================
        // НОВАЯ КОТИРОВКА
        // =============================================

        if (data.type !== "spread") {
            return;
        }


        document.getElementById("bid1").textContent =
            fmt(data.bid1);

        document.getElementById("ask1").textContent =
            fmt(data.ask1);

        document.getElementById("mid1").textContent =
            fmt(data.mid1);


        document.getElementById("bid2").textContent =
            fmt(data.bid2);

        document.getElementById("ask2").textContent =
            fmt(data.ask2);

        document.getElementById("mid2").textContent =
            fmt(data.mid2);


        const spread =
            Number(data.spread);


        if (!Number.isFinite(spread)) {
            return;
        }


        document.getElementById("spread").textContent =
            "SPREAD: " +
            spread.toFixed(4) +
            "%";


        document.getElementById("status").textContent =
            "Данные поступают";


        // =============================================
        // ВРЕМЯ ТОЧКИ
        // =============================================

        const now =
            Math.floor(
                Date.now() / 1000
            );


        // =============================================
        // ДОБАВЛЯЕМ ТОЧКУ
        // =============================================

        spreadSeries.update({

            time: now,

            value: spread

        });


        // =============================================
        // ГЛАВНОЕ ИСПРАВЛЕНИЕ
        //
        // ПОСЛЕ КАЖДОЙ НОВОЙ ТОЧКИ
        // ГРАФИК АВТОМАТИЧЕСКИ СДВИГАЕТСЯ
        // К ТЕКУЩЕМУ ВРЕМЕНИ.
        // =============================================

        if (firstPoint) {

            chart.timeScale()
                .scrollToRealTime();

            firstPoint = false;

        } else {

            chart.timeScale()
                .scrollToRealTime();
        }

    };


    ws.onclose = function() {

        document.getElementById("status").textContent =
            "Соединение закрыто — нажмите «Подключить»";
    };


    ws.onerror = function() {

        document.getElementById("status").textContent =
            "Ошибка WebSocket";
    };
}


// =====================================================
// КНОПКА
// =====================================================

document
    .getElementById("connect")
    .addEventListener(
        "click",
        connect
    );


// =====================================================
// ЗАПУСК ГРАФИКА
// =====================================================

createChart();

resizeChart();

</script>

</body>
</html>
